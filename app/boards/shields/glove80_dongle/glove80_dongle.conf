# Wrapper shield config.
# Keep dongle-only final overrides here since this file is merged last.
#
# RGB underglow is ENABLED on the dongle so that &rgb_ug behaviours (e.g.
# those on the Magic layer) have BEHAVIOR_LOCALITY_GLOBAL semantics and are
# forwarded to every connected peripheral via ZMK's split run-behaviour
# service.  The dongle drives SPI1/P0.27 — a WS2812-capable pin — but
# whether a physical LED strip is attached is irrelevant; the key effect
# is the global dispatch to the peripheral halves that DO have LED strips.
#
# NOTE: ZMK_EXT_POWER is not available on the dongle board (no GPIO for it),
# so underglow ext-power must be disabled for this target.
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
CONFIG_SPI=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# Keep these in shield config so board folder syncs do not remove them.
CONFIG_BUILD_OUTPUT_UF2=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_CTLR_PHY_CODED=n

# Keyboard IDs
CONFIG_ZMK_KEYBOARD_NAME="Glove80 Dongle"
CONFIG_USB_DEVICE_PID=0x27db
CONFIG_USB_DEVICE_VID=0x16c0
CONFIG_USB_DEVICE_MANUFACTURER="MoErgo"
CONFIG_USB_DEVICE_SN="moergo.com:GLV80-DONGLE-0123456789"

CONFIG_BT_DEVICE_NAME="Glove80 Dongle"

CONFIG_BT_DIS_PNP_PID=0x27db
CONFIG_BT_DIS_PNP_VID=0x16c0
CONFIG_BT_DIS_MANUF="MoErgo"
CONFIG_BT_DIS_MODEL="Glove80 Dongle"

# Dongle is the split BLE central for both halves.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# Allow safe recovery from stale peripheral bonds after reflashing/power cycles.
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n

# Keep status parity with other MoErgo central configurations.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
