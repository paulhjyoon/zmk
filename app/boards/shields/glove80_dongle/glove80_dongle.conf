# Wrapper shield config.
# Keep dongle-only final overrides here since this file is merged last.
#
# RGB underglow is ENABLED on the dongle so that &rgb_ug behaviours (e.g.
# those on the Magic layer) have BEHAVIOR_LOCALITY_GLOBAL semantics and are
# forwarded to every connected peripheral via ZMK's split run-behaviour
# service.  The dongle drives SPI1/P0.27 — a WS2812-capable pin — but
# whether a physical LED strip is attached is irrelevant; the key effect
# is the global dispatch to the peripheral halves that DO have LED strips.
#
# NOTE: ZMK_EXT_POWER is not available on the dongle board (no GPIO for it),
# so underglow ext-power must be disabled for this target.
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
CONFIG_SPI=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n