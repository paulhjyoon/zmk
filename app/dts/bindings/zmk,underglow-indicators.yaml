description: Underglow indicators

compatible: "zmk,underglow-indicators"

# GLOVE80_DONGLE: Optional indicator for most properties and add new dongle-central USB output state.
properties:
  bat-lhs:
    type: array
    required: true
  bat-rhs:
    type: array
    required: false
  capslock:
    type: int
    required: false
  numlock:
    type: int
    required: false
  scrolllock:
    type: int
    required: false
  layer-state:
    type: array
    required: false
  ble-state:
    type: array
    required: false
  usb-state:
    type: int
    required: false
  output-fallback:
    type: int
    required: false
  central-usb:
    type: array
    required: false
    description: >
      LED indices indicating that the dongle central is outputting USB
